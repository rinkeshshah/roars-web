# Journal redirects that are NOT in the supplied map.
#
# Different from journal-redirect-overrides.conf, which corrects a target the
# supplied map already has. These are sources the map never listed at all, so
# an override would fail its own stale-override check.
#
# Syntax: the same as the supplied map, with a `# why:` line above each rule.
#
# scripts/generate-journal-htaccess.mjs fails if a source here IS in the
# supplied map (it belongs in the overrides file instead), and the ordinary
# safety rules still apply afterwards: a source that is a migrated post, a
# self-redirect, or a target that is not built is still held back.

# why: The cannibalisation named in docs/URL-INVENTORY-FINDINGS.md section 2.1.
# This journal post and /industries/healthcare-app-development-company/ compete
# for the same query on the same site, and the industry page is the one that
# should win: it is commercial, it is designed, and it is the page a buyer
# wants. The post carries 206 impressions and zero clicks over sixteen months,
# so nothing is lost by folding it into the page it was competing with. Decided
# by the client, who reversed an earlier call to migrate it as a post.
Redirect 301 /our-journal/healthcare-app-development-company/ https://www.roarsinc.com/industries/healthcare-app-development-company/

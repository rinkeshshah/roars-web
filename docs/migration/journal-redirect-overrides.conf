# Corrections to roarsinc-redirects.conf, journal section.
#
# The supplied map stays exactly as supplied. Corrections live here so that
# re-exporting the decisions does not silently drop them, and so the reason for
# each one is next to the rule rather than in a commit message.
#
# Syntax: the same as the supplied map, with a `# why:` line above each rule.
# A source listed here replaces that source's target in the supplied map.
#
# scripts/generate-journal-htaccess.mjs fails if an override's source is not in
# the supplied map (stale override), or if it sets the same target the supplied
# map already has (the upstream map was fixed; delete the override).

# why: The supplied map's topic-fallback rule aimed every generic UX post at
# why-invest-in-ux-design-services-essential without checking that the target
# was itself in the redirect bucket. It was, so it redirected to itself and
# took four other rules down with it. That post is not being migrated: 57
# impressions and zero clicks is not a reason to promote a page that was only
# load-bearing by accident. The service page is topically exact and commercial.
Redirect 301 /our-journal/why-invest-in-ux-design-services-essential/ https://www.roarsinc.com/s/user-experience-design-agency/

# why: Same fallback bug. Same destination, for the same reason.
Redirect 301 /our-journal/saas-ux-design-how-to-build-products-that-users-actually-want-to-pay-for/ https://www.roarsinc.com/s/user-experience-design-agency/

# why: Same fallback bug.

name: Build and deploy

# The build runs HERE, never on the Plesk server. Only finished static files
# reach the box: no Node, no toolchain, no node_modules in the webspace.
#
# DEPLOY DIRECTION. This workflow does not touch the server and holds no
# credentials for it. It publishes dist/ to the `deploy` branch and Plesk
# pulls from GitHub. If this repository or its Actions were ever compromised,
# the blast radius stops at the repo; there is no SSH key here to steal.
#
# `deploy` is rebuilt as an ORPHAN every run: a fresh git history containing
# only the built output, force-pushed. That keeps build artefacts out of the
# source history and stops the repository growing by a full copy of the site
# on every build.
#
# ── THE PUSH TRIGGER IS STILL OFF, AND THERE IS ONE REASON LEFT. ──────────
#
# The force-push is gone. Publishing now runs scripts/deploy.sh and
# scripts/deploy-production.sh -- the same scripts a developer runs, which
# fast-forward an existing branch instead of rewriting it, and which carry
# assertions CI could not otherwise make. Production is a target here now
# rather than something pushed from one person's laptop. Both conditions
# named in the previous commit are met.
#
# WHAT IS NOT MET: this workflow has never executed. Not once. Nothing has
# ever pushed to `main`, so every line below is unproven -- including two
# steps that now publish to the branch Plesk serves the LIVE SITE from.
# Turning the trigger on would make the first execution of untested CI also
# its first production deploy.
#
# So: run it by hand once (Actions > Build and deploy > Run workflow). From a
# feature branch every publish step is skipped by its own `github.ref` guard,
# which exercises the whole build and every assertion with nothing at stake.
# When that is green from `main`, restore:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy mid-publish

permissions:
  contents: write # the publish scripts push deploy and production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The publish scripts fetch the deploy/production branches and push
          # to origin, so the checkout's credentials have to stay on the
          # remote (the default) and the history has to be deep enough to
          # build a commit message from.
          fetch-depth: 0

      # Both publish scripts set their own author inline on the commit, so
      # this is not what makes them work. It is here for `git worktree` and
      # anything added later that commits without thinking about it -- a
      # runner with no identity fails at the least convenient moment.
      - name: Identify the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium for the browser assertions below. --with-deps pulls the
      # system libraries the runner image does not ship.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Fails the build on thin content, duplicate meta, broken internal
      # links, malformed front matter, or out-of-range SEO fields.
      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Validate redirects
        run: node scripts/validate-redirects.mjs

      # Indexing stays OFF until the site is finished. See docs/NOINDEX.md.
      # Going live is a repository-variable change, not a code change.
      - name: Build
        run: npm run build
        env:
          PUBLIC_ALLOW_INDEXING: ${{ vars.PUBLIC_ALLOW_INDEXING }}
          # The Turnstile SITE key, which is public by design: it ships in the
          # HTML of every page that carries a form, and is useless without the
          # secret, which lives only in contact-config.php on the server and
          # must never appear here.
          #
          # IT IS THE ONLY THING RENDERING THE WIDGET. The markup is
          # conditional on this value, so an unset variable does not degrade
          # the defence -- it removes it silently, leaves the server verifying
          # a token nobody sent, and is exactly how the bot submissions got in.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # Emits real nginx 301s. Astro's own redirects are meta-refresh pages,
      # which pass equity poorly, so they are applied in dev only.
      - name: Generate nginx redirect rules
        run: node scripts/generate-nginx-redirects.mjs

      # THE GUARD. Never make this non-fatal and never skip it. It also fails
      # if a meta-refresh page reached dist/, or if any page is not
      # directory-format. BUILD_PHASE scopes it to the routes that should
      # exist yet; the full 194 are enforced from phase 6.
      - name: Assert every inventory URL exists in dist
        run: node scripts/assert-urls.mjs
        env:
          BUILD_PHASE: ${{ vars.BUILD_PHASE || '0' }}

      # THE OTHER GUARD. A scoped rule that matches nothing is the one CSS
      # failure with no error message: the stylesheet is present, correct and
      # inert. It cost this project the homepage About grid and the hero's
      # 900px min-height, both of which reviewed clean. Never make it
      # non-fatal. scripts/assert-styles.mjs explains the mechanism.
      - name: Assert every scoped style matches something
        run: node scripts/assert-styles.mjs

      # Names on real people's testimonials. A visual diff cannot see a
      # scrambled attribution, and the prototypes shipped several. Prints the
      # unverified list on every run; fails from phase 6 (cutover).
      - name: Assert every attribution is sourced
        run: node scripts/assert-attribution.mjs
        env:
          BUILD_PHASE: ${{ vars.BUILD_PHASE || '0' }}

      # --- browser assertions --------------------------------------------
      # Keyboard reachability, focus trap, one-open-at-a-time accordion,
      # filtering without a URL change, ink inversion, reduced motion, and
      # the homepage LCP / CLS / JS budgets. None of these are checkable by
      # reading the code, which is why they run on every push.

      - name: Content gate self-test
        run: node scripts/test-content-gate.mjs

      # python3 is already on the runner, so this pulls no extra packages.
      - name: Serve dist for browser tests
        run: |
          (cd dist && python3 -m http.server 4325 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4325/ && exit 0
            sleep 1
          done
          echo "static server did not come up"; exit 1

      - name: Component assertions
        run: node scripts/test-components.mjs
        env:
          BASE: http://127.0.0.1:4325

      - name: Homepage budgets
        run: node scripts/test-homepage.mjs
        env:
          BASE: http://127.0.0.1:4325

      # --- publish dev ----------------------------------------------------
      # THROUGH THE SCRIPT, NOT INLINE. This step used to be fifteen lines of
      # `git init` and `git push --force`, which rewrote the branch on every
      # run. scripts/deploy.sh exists because that broke dev: a force-push is
      # a non-fast-forward, Plesk's `git pull` refuses it, and the branch on
      # GitHub goes on looking correct while the server sits on the old build.
      # Silent, and indefinite.
      #
      # Running the same script a developer runs also means the two cannot
      # drift. Every assertion in it -- and there are several that only exist
      # there -- applies to a CI deploy as well.
      - name: Publish dist to the deploy branch (dev)
        if: github.ref == 'refs/heads/main'
        run: ./scripts/deploy.sh "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"

      # --- publish production ---------------------------------------------
      # A SECOND BUILD, because it is a different build. PUBLIC_ALLOW_INDEXING
      # is off for dev and on for production: unset, every page ships
      # `noindex, nofollow` and no sitemap is emitted at all. The two cannot
      # share an artefact, so production is rebuilt here rather than reusing
      # the dist/ above.
      #
      # Production deploys have been running off a developer's laptop. That is
      # the other half of the force-push problem: a deploy nobody else can
      # reproduce, gated on one machine having the right env file.
      - name: Rebuild for production
        if: github.ref == 'refs/heads/main' && vars.PUBLIC_ALLOW_INDEXING == 'true'
        run: npm run build
        env:
          PUBLIC_ALLOW_INDEXING: 'true'
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # The script asserts, then pushes. It refuses a build with no sitemap,
      # a homepage that is not index,follow, the dev host anywhere in the
      # content, no Turnstile widget, or a Cloudflare TEST site key. None of
      # those are things CI could otherwise notice.
      - name: Publish dist to the production branch
        if: github.ref == 'refs/heads/main' && vars.PUBLIC_ALLOW_INDEXING == 'true'
        run: ./scripts/deploy-production.sh "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # NOT WRITTEN YET. scripts/indexnow.mjs does not exist; the condition
      # below means the step never runs while the site is noindexed, so it is
      # inert rather than broken. Write it as part of going live.
      - name: Ping IndexNow
        if: github.ref == 'refs/heads/main' && vars.PUBLIC_ALLOW_INDEXING == 'true'
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
